# Builds fresh forecast data and deploys the site to GitHub Pages as an
# artifact — no data is ever committed to the repository.
#
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
#
# If the pipeline fails (a critical data source is down), the deploy is
# skipped and the previously published snapshot stays live.
name: Build and Deploy

on:
  schedule:
    - cron: '0 */6 * * *'   # refresh data every 6 hours
  push:
    branches: [main]         # redeploy on code changes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # MOP publishes a pure forward forecast, so elapsed timesteps vanish
      # from the source. The adapter keeps a tiny per-spot cache
      # (data/mop_cache/) to backfill the current day; persist it across runs
      # here since the repo never commits data. The run_id key always misses,
      # so each run restores the newest previous cache and saves its own.
      - name: Restore MOP cache
        uses: actions/cache@v4
        with:
          path: data/mop_cache
          key: mop-cache-${{ github.run_id }}
          restore-keys: mop-cache-

      - name: Run data pipeline
        run: python backend/pipeline.py

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js images api _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
