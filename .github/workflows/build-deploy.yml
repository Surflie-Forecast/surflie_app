# Builds fresh forecast data on a schedule and deploys the site to GitHub
# Pages as an artifact.
#
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
#
# Two kinds of runs:
#   - schedule / manual dispatch: full data build, then deploy. Each build
#     also saves api/ to the actions cache.
#   - push: NEVER rebuilds data. Deploys the newer (by api/meta.json) of the
#     repo's committed api/ — pushed after a local pipeline run — and the
#     last scheduled build's cache, so a code-only push can't roll the live
#     data back in time. Only if neither yields usable data (first run,
#     cache evicted, nothing committed) does the push fall back to a full
#     build rather than deploying an empty site.
#
# If the pipeline fails (a critical data source is down), the deploy is
# skipped and the previously published snapshot stays live.
name: Build and Deploy

on:
  schedule:
    # Twice daily, phased to when new model runs land on Open-Meteo (measured
    # from marine-api.open-meteo.com/data/{model}/static/meta.json, July
    # 2026): GFS Wave ~H+5.3h, ECMWF WAM9 ~H+6.2h, WAM25 ~H+7.0h after each
    # 00/06/12/18Z init; MFWAM lands ~00:05/12:05, GWAM ~04:25/16:25 UTC.
    # 01:45 catches the 00Z MFWAM + prior GFS/WAM; 13:45 the 12Z MFWAM +
    # ~06Z GFS/WAM. Cut from 4x to 2x/day to stay in the Actions free tier
    # at 276 spots (the 276-spot build is ~15-25 min via CDIP's slow THREDDS
    # from GH IPs); forecasts refresh every ~12h. GH cron fires ~5-15 min
    # late, adding margin.
    - cron: '45 1,13 * * *'
  push:
    branches: [main]         # redeploy on code/data changes (no data rebuild)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Push runs deploy prebuilt data. Stash the repo's committed api/ so
      # the cache restore below can't clobber it before the freshness pick.
      - name: Stash committed forecast data
        if: github.event_name == 'push'
        run: |
          rm -rf repo-api
          if [ -d api ]; then mv api repo-api; fi

      # The run_id key never matches, so restore-keys always picks the most
      # recent save from a scheduled/dispatched build.
      - name: Restore forecast data from the last scheduled build
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: api
          key: api-data-${{ github.run_id }}
          restore-keys: api-data-

      # Keep whichever snapshot is newer per api/meta.json (ISO-8601 UTC, so
      # plain string comparison orders correctly). Data without a meta stamp
      # (pre-stamp cache, failed run) loses to a stamped one.
      - name: Pick newest prebuilt data
        if: github.event_name == 'push'
        id: prebuilt
        run: |
          committed=$(jq -r '.generated_utc // empty' repo-api/meta.json 2>/dev/null || true)
          cached=$(jq -r '.generated_utc // empty' api/meta.json 2>/dev/null || true)
          echo "committed: ${committed:-none}  cached: ${cached:-none}"
          if [ -d repo-api ] && { [ ! -d api ] || [ "$committed" \> "$cached" ]; }; then
            rm -rf api
            mv repo-api api
            echo "deploying committed api/"
          elif [ -d api ]; then
            echo "deploying cached api/"
          fi
          have_data=false
          if [ -s api/spots.json ] && [ "$(jq 'length' api/spots.json)" -gt 0 ]; then
            have_data=true
          fi
          echo "have_data=$have_data" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: mode
        run: echo "build=${{ github.event_name != 'push' || steps.prebuilt.outputs.have_data != 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.mode.outputs.build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.mode.outputs.build == 'true'
        run: pip install -r backend/requirements.txt

      # MOP publishes a pure forward forecast, so elapsed timesteps vanish
      # from the source. The adapter keeps a tiny per-spot cache
      # (data/mop_cache/) to backfill the current day; persist it across runs
      # here since the repo never commits it. The run_id key always misses,
      # so each run restores the newest previous cache and saves its own.
      - name: Restore MOP cache
        if: steps.mode.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: data/mop_cache
          key: mop-cache-${{ github.run_id }}
          restore-keys: mop-cache-

      # Forecast-skill state (backend/skill.py): archived forecast runs and
      # the accumulated bias/RMSE buckets vs the MOP nowcast. Pure
      # accumulator — losing it only resets the statistics.
      - name: Restore skill-scoring state
        if: steps.mode.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: data/skill
          key: skill-state-${{ github.run_id }}
          restore-keys: skill-state-

      # Tide predictions are deterministic, so the adapter keeps a rolling
      # per-spot cache (data/tide_cache/) covering the display window: one
      # seeding fetch, then a daily tail top-up, zero calls in between.
      - name: Restore tide cache
        if: steps.mode.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: data/tide_cache
          key: tide-cache-${{ github.run_id }}
          restore-keys: tide-cache-

      # --scheduled state: the previous run's store dump feeds carry-forward
      # of wave models that had no new run upstream, and model_state.json
      # holds the per-model availability stamps that decide the skip.
      - name: Restore pipeline state (carry-forward + model stamps)
        if: steps.mode.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/store.csv
            data/model_state.json
          key: pipeline-state-${{ github.run_id }}
          restore-keys: pipeline-state-

      # Buoy detail files carry skipped models' series over from their
      # previous versions, so give the build the newest published api/ (the
      # pipeline overwrites everything it generates).
      - name: Restore previous api for buoy carry-forward
        if: steps.mode.outputs.build == 'true'
        uses: actions/cache/restore@v4
        with:
          path: api
          key: api-data-${{ github.run_id }}
          restore-keys: api-data-

      - name: Run data pipeline
        if: steps.mode.outputs.build == 'true'
        env:
          SALIX_TOKEN: ${{ secrets.SALIX_TOKEN }}
        run: python backend/pipeline.py --scheduled

      # Swell alarms: evaluate user alerts against this run's fresh forecast
      # and email matches (backend/alerts.py). Best-effort: the script skips
      # itself when the secrets are absent and exits 0 on any failure — it
      # can never sink a good data build.
      - name: Evaluate swell alarms
        if: steps.mode.outputs.build == 'true'
        env:
          SUPABASE_URL: https://axbjsbtepbecalvaamnu.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM: Surflie <alerts@send.surflie.app>
          SITE_URL: https://surflie.app
        run: python backend/alerts.py

      # Every full build leaves its api/ behind for push-triggered redeploys
      - name: Save forecast data for push redeploys
        if: steps.mode.outputs.build == 'true'
        uses: actions/cache/save@v4
        with:
          path: api
          key: api-data-${{ github.run_id }}

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js images api _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
