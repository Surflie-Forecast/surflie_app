name: Update Surf Forecast Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ./gee_key.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # We removed 'persist-credentials: false' so the checkout action 
          # handles the authentication for us automatically.

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Create Google Earth Engine credentials file
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$GEE_SERVICE_ACCOUNT_KEY" > gee_key.json
          chmod 600 gee_key.json

      - name: Run data fetch pipeline
        run: python3 backend/fetch_data.py

      - name: Build static JSON files
        run: python3 backend/build.py

      # NO 'Set up Git' step needed here.
      
      - name: Commit and push updated data
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add data/*.csv api/
          
          # Commit changes if there are any
          git diff --staged --quiet || git commit -m "Auto-update forecast data - $(date -u +'%Y-%m-%d %H:%M UTC')"
          
          # FIX: Pull the latest changes from remote and rebase your commit on top
          git pull --rebase origin main
          
          git push origin HEAD:main --follow-tags