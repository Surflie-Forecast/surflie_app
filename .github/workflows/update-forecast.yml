name: Update Surf Forecast Data

on:
  schedule:
    # Run every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

permissions:
  contents: write
  
jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ./gee_key.json
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
      
      - name: Create Google Earth Engine credentials file
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$GEE_SERVICE_ACCOUNT_KEY" > gee_key.json
          chmod 600 gee_key.json
      
      - name: Run data fetch pipeline
        run: python3 backend/fetch_data.py
      
      - name: Build static JSON files
        run: python3 backend/build.py
      
      - name: Commit and push updated data
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/*.csv api/
          git diff --staged --quiet || git commit -m "Auto-update forecast data - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push