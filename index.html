<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surflie | Forecast</title>
    <link rel="icon" type="image/png" href="images/favicon.png?v=4">
    <link rel="stylesheet" href="css/styles.css?v=50">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rubik:ital,wght@0,400;0,700;1,900&display=swap"
        rel="stylesheet">
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
    <div class="app-container">
        <header>
            <div class="brand">
                <img src="images/logo.png" alt="Surflie Logo" height="60">
                Surflie<span
                    style="font-size: 0.3em; font-family: Arial, sans-serif; position: relative; top: -0.5em; line-height: 0; margin-left: -0.1em;">&trade;</span>
            </div>
            <div class="header-right">
                <div class="unit-toggle-wrapper">
                    <span class="unit-label">M</span>
                    <label class="switch">
                        <input type="checkbox" class="unit-toggle" id="unitToggleDesktop">
                        <span class="slider round"></span>
                    </label>
                    <span class="unit-label">FT</span>
                </div>
                <div class="date-display desktop-only" id="currentDate"></div>
            </div>
        </header>

        <main>
            <section class="hero">
                <!-- Pulse badge removed as requested -->
                <div id="heroStaticMap" class="hero-static-map"></div>

                <div class="hero-content">
                    <h1 id="spotName">Devereaux Beach</h1>

                    <div class="search-container">
                        <input type="text" id="spotSearch" placeholder="You won't know until you go...">
                        <button id="searchBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </button>
                        <!-- Map Button -->
                        <button id="mapBtn" class="map-btn" title="View Map">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                                <line x1="8" y1="2" x2="8" y2="18"></line>
                                <line x1="16" y1="6" x2="16" y2="22"></line>
                            </svg>
                        </button>
                        <div id="searchResults" class="search-results"></div>
                    </div>
                </div>

                <!-- Buoy-view sub line: "the closest buoy to {spot}"
                     (bottom-left; the title itself becomes the buoy code) -->
                <div id="buoyHeroLabel" class="buoy-hero-label"></div>

                <!-- Map Overlay -->
                <div id="mapOverlay" class="map-overlay">
                    <button id="closeMapBtn" class="close-map-btn">&times;</button>
                    <div id="surfMap"></div>
                </div>
            </section>

            <!-- Zero-height container: floats the compare buttons in the
                 hero/chart boundary without adding vertical space. Buoys owns
                 the corner slot; Models sits to its left. -->
            <div class="chart-gap-container">
                <div id="modelLegend" class="model-legend"></div>
                <button id="modelCompareBtn" class="model-compare-btn" style="display: none;"
                    title="Overlay all wave models (combined Hs)">Models</button>
                <button id="buoyCompareBtn" class="model-compare-btn buoy-compare-btn" style="display: none;"
                    title="Observed Hs vs MOP forecast vs global models at the spot's closest buoy">Buoys</button>
            </div>

            <section class="chart-section" id="waveChartSection" style="display: none;">
                <!-- Site Name on Map Expand -->
                <div id="mapSiteNameContainer" class="map-site-name-container"></div>

                <div class="chart-container" id="waveChartContainer">
                    <!-- Bars will be injected here -->
                </div>
                <div class="chart-labels" id="waveChartLabels">
                    <!-- Time labels will be injected here -->
                </div>
            </section>

            <!-- Latest-observation cards, shown only in the Buoys view -->
            <div id="buoyStats" class="buoy-stats" style="display: none;"></div>

            <!-- Zero-height container for elements between chart and forecast list -->
            <div class="forecast-gap-container">
                <div class="forecast-days-counter" id="forecastDaysCounter" style="display: none;"></div>
            </div>

            <div class="forecast-wrapper">
                <section class="forecast-container" id="forecastContainer">
                    <!-- Forecast Cards will be injected here by JS -->
                </section>
                <div class="scroll-indicator" id="scrollIndicator">
                    <div class="scroll-dot" id="scrollDotLeft"></div>
                    <div class="scroll-bar" id="scrollBar"></div>
                    <div class="scroll-dot" id="scrollDotRight"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Supabase client (auth + user preferences) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <!-- Bump ?v= whenever these files change so cached copies are dropped -->
    <script src="js/auth.js?v=25"></script>
    <script src="js/rating.js?v=2"></script>
    <script src="js/hourly.js?v=2"></script>
    <script src="js/chart.js?v=28"></script>

    <script src="js/app.js?v=19"></script>
</body>

</html>
