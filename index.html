<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surflie | Forecast</title>
    <link rel="icon" type="image/png" href="images/favicon.png?v=4">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rubik:ital,wght@0,400;0,700;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="brand">
                <img src="images/logo.png" alt="Surflie Logo" height="60">
                Surflie
            </div>
            <div class="header-right">
                <div class="unit-toggle-wrapper desktop-only">
                    <span class="unit-label">M</span>
                    <label class="switch">
                        <input type="checkbox" class="unit-toggle" id="unitToggleDesktop">
                        <span class="slider round"></span>
                    </label>
                    <span class="unit-label">FT</span>
                </div>
                <div class="date-display" id="currentDate"></div>
            </div>
        </header>

        <div class="controls-bar mobile-only">
            <div class="unit-toggle-wrapper">
                <span class="unit-label">M</span>
                <label class="switch">
                    <input type="checkbox" class="unit-toggle" id="unitToggleMobile">
                    <span class="slider round"></span>
                </label>
                <span class="unit-label">FT</span>
            </div>
        </div>

        <main>
            <section class="hero">
                <!-- Pulse badge removed as requested -->
                <h1 id="spotName">Devereaux Beach</h1>

                <div class="search-container">
                    <input type="text" id="spotSearch" placeholder="You won't know until you go...">
                    <button id="searchBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                    <div id="searchResults" class="search-results"></div>
                </div>
            </section>

            <div class="forecast-wrapper">
                <section class="forecast-container" id="forecastContainer">
                    <!-- Forecast Cards will be injected here by JS -->
                </section>
            </div>
        </main>
    </div>

    <script src="js/rating.js"></script>
    <script src="js/hourly.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
